spring.application.name=clima-backend
server.port=8081
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/clima_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:GabiGol10}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Valores de desenvolvimento local; substitua-os por variaveis de ambiente fora da maquina de testes.
app.jwt.secret=${JWT_SECRET:Clima-Local-Dev-Secret-Change-Before-Deploy-2026-Only}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.security.frontend-header=Clima-Angular-SPA
app.seed.password=${SEED_PASSWORD:123456}
app.seed.enabled=${SEED_ENABLED:true}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
